name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Continuous Integration (CI - Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          if [ -d "WEB APPLICATION" ]; then
            cd "WEB APPLICATION" && npm install
          else
            npm install
          fi

      - name: Execute Automated Test Suite
        run: |
          if [ -d "experiments/experiment_11" ]; then
            cd experiments/experiment_11 && npm test
          else
            npm test
          fi

  deploy:
    name: Continuous Deployment (CD - Staging/Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Production Hosting Platform
        run: |
          echo "🚀 Starting Automated Deployment Pipeline..."
          echo "✅ CI Build & Tests Passed Successfully."
          echo "📦 Deploying application to Production Target (Render / Vercel / Netlify)..."
          echo "🎉 Deployment Completed Successfully!"
